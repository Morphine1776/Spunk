services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Spunk_Dev_Passw0rd!"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  spunk:
    build: .
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=Spunk;User Id=sa;Password=Spunk_Dev_Passw0rd!;TrustServerCertificate=True;Encrypt=True"
      Ingest__UdpPort: "514"
      Ingest__TcpPort: "514"
      Ingest__HecToken: "spunk-hec-token"
    ports:
      - "8080:8080"
      - "514:514/udp"
      - "514:514/tcp"
